<h1>{{newProduct | json}}</h1>

<form (submit)="addNewProduct()">
  <div class="mb-3">
    <label for="exampleInputName" class="form-label">Name:</label>
    <input
      type="text"
      [(ngModel)]="newProduct.name"
      name="name"
      class="form-control"
      id="exampleInputName"
    />
  </div>
  <div class="mb-3">
    <label for="exampleInputPrice" class="form-label">Price:</label>
    <input
      type="number"
      [(ngModel)]="newProduct.price"
      name="price"
      class="form-control"
      id="exampleInputPrice"
    />
  </div>
  <div class="mb-3">
    <label for="exampleInputQuantity" class="form-label">Quantity:</label>
    <input
      type="number"
      [(ngModel)]="newProduct.quantity"
      name="quantity"
      class="form-control"
      id="exampleInputQuantity"
    />
  </div>
  <div class="mb-3">
    <label for="exampleInputImage" class="form-label">Image:</label>
    <input
      type="file"
      [(ngModel)]="newProduct.imgUrl"
      name="imgUrl"
      class="form-control"
      id="exampleInputImage"
    />
  </div>

  <div class="mb-3">
    <label for="categories" class="form-label">Categories:</label>

    <select class="form-select form-select-lg" name="catId" id="" [(ngModel)]="newProduct.catId">
      @for(cat of categories; track cat.id){
      <option [value]="cat.id">{{ cat.name }}</option>
      }
    </select>
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>
</form>
